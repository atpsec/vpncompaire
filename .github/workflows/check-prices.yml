name: Weekly pricing and source-link audit

on:
  schedule:
    # Mondays 08:17 UTC — off-peak, off the :00 mark
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run pricing audit
        id: pricing
        run: node scripts/check-prices.mjs
        continue-on-error: true

      - name: Run source-link audit
        id: links
        run: node scripts/check-external-links.mjs
        continue-on-error: true

      - name: Combine audit reports
        if: always()
        run: |
          touch .pricing-report.md .link-health-report.md
          {
            cat .pricing-report.md
            printf '\n---\n\n'
            cat .link-health-report.md
          } > .site-health-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-health-report
          path: |
            .pricing-report.md
            .link-health-report.md
            .site-health-report.md
          retention-days: 30

      - name: Open issue on confirmed drift or broken links
        if: steps.pricing.outcome == 'failure' || steps.links.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO=$(date -u +%Y-%m-%d)
          gh issue create \
            --title "Site health audit — ${ISO}" \
            --label "pricing,audit" \
            --body-file .site-health-report.md \
            || echo "Issue creation skipped (label may be missing or duplicate exists)"
