name: Weekly pricing and source-link audit

on:
  schedule:
    # Mondays 08:17 UTC — off-peak, off the :00 mark
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run pricing audit
        id: pricing
        run: node scripts/check-prices.mjs
        continue-on-error: true

      - name: Run source-link audit
        id: links
        run: node scripts/check-external-links.mjs
        continue-on-error: true

      - name: Run content quality audit
        id: content
        run: node scripts/audit-content-quality.mjs
        continue-on-error: true

      - name: Run research freshness audit
        id: freshness
        run: node scripts/check-research-freshness.mjs
        continue-on-error: true

      - name: Restore monitored source snapshots
        id: source-cache
        uses: actions/cache/restore@v4
        with:
          path: .runtime/research-sources
          key: research-source-snapshots-${{ hashFiles('data/research/monitored-sources.json') }}

      - name: Monitor research sources
        id: source-diff
        run: |
          if [ "${{ steps.source-cache.outputs.cache-hit }}" = "true" ]; then
            node scripts/research-source-diff.mjs --strict
          else
            node scripts/research-source-diff.mjs --update
          fi
        continue-on-error: true

      - name: Save monitored source snapshots
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .runtime/research-sources
          key: research-source-snapshots-${{ hashFiles('data/research/monitored-sources.json') }}

      - name: Combine audit reports
        if: always()
        run: |
          touch .pricing-report.md .link-health-report.md .research-change-report.md
          {
            cat .pricing-report.md
            printf '\n---\n\n'
            cat .link-health-report.md
            printf '\n---\n\n'
            cat .research-freshness-report.md
            printf '\n---\n\n'
            cat .research-change-report.md
          } > .site-health-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-health-report
          path: |
            .pricing-report.md
            .link-health-report.md
            .research-freshness-report.md
            .research-change-report.md
            .site-health-report.md
          retention-days: 30

      - name: Open issue on confirmed drift, broken links or content regression
        if: steps.pricing.outcome == 'failure' || steps.links.outcome == 'failure' || steps.content.outcome == 'failure' || steps.freshness.outcome == 'failure' || steps.source-diff.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO=$(date -u +%Y-%m-%d)
          gh issue create \
            --title "Site health audit — ${ISO}" \
            --label "pricing,audit" \
            --body-file .site-health-report.md \
            || echo "Issue creation skipped (label may be missing or duplicate exists)"
